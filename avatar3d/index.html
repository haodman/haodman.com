<!DOCTYPE html>
<html lang="zh-CN" data-theme="studio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D Avatar 转台 · Haodman</title>
<meta name="description" content="Hunyuan3D 图生 3D 生成的 Avatar，可拖拽旋转的实时预览。">
<meta property="og:title" content="3D Avatar 转台">
<meta property="og:description" content="拖拽旋转、素模切换的实时 3D 预览。">
<meta property="og:type" content="website">
<style>
  :root{
    --ink:#E9ECF2; --dim:#7E8798; --line:rgba(255,255,255,.11);
    --panel:rgba(17,20,27,.60); --panel-hi:rgba(255,255,255,.07);
    --accent:#9BBE80;
    --sky-1:#232833; --sky-2:#0C0E13;
    --mono: ui-monospace,SFMono-Regular,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,"Liberation Mono","PingFang SC","Microsoft YaHei",monospace;
  }
  html[data-theme="paper"]{
    --ink:#171A20; --dim:#6B7280; --line:rgba(0,0,0,.13);
    --panel:rgba(255,255,255,.66); --panel-hi:rgba(0,0,0,.05);
    --accent:#4E7A3C;
    --sky-1:#F3F4F1; --sky-2:#D5D8D2;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--sky-2); color:var(--ink);
    font-family:var(--mono); -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #stage{
    position:fixed; inset:0;
    background:
      radial-gradient(120% 85% at 50% 8%, var(--sky-1) 0%, var(--sky-2) 72%);
    transition:background .5s ease;
  }
  #canvas{position:absolute;inset:0}
  #canvas canvas{display:block;width:100%;height:100%}

  .hud{position:absolute;z-index:3;pointer-events:none}
  .tl{top:clamp(14px,2.6vmin,26px);left:clamp(14px,2.6vmin,26px)}
  .tr{top:clamp(14px,2.6vmin,26px);right:clamp(14px,2.6vmin,26px);text-align:right}

  .eyebrow{
    font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--dim);margin:0 0 7px;display:flex;gap:8px;align-items:center
  }
  .eyebrow::before{
    content:"";width:16px;height:1px;background:var(--accent);opacity:.9
  }
  h1{
    margin:0;font-size:clamp(15px,2.2vmin,19px);font-weight:600;
    letter-spacing:.01em;line-height:1.25
  }
  .sub{margin:6px 0 0;font-size:10.5px;color:var(--dim);letter-spacing:.05em}

  /* azimuth readout — the turntable dial */
  .dial{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .az{
    font-size:clamp(22px,4.4vmin,34px);font-weight:600;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:.02em
  }
  .az span{color:var(--dim);font-weight:400}
  .az-label{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .meter{
    width:clamp(84px,15vmin,124px);height:2px;background:var(--line);position:relative;overflow:hidden
  }
  .meter i{position:absolute;top:0;bottom:0;width:14%;background:var(--accent);transition:left .08s linear}
  .facts{
    margin-top:12px;font-size:9.5px;color:var(--dim);line-height:1.75;letter-spacing:.04em
  }
  .facts b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

  /* hint */
  .hint{
    position:absolute;left:50%;bottom:calc(clamp(14px,2.6vmin,26px) + 62px);
    transform:translateX(-50%);z-index:3;pointer-events:none;
    font-size:10px;letter-spacing:.16em;color:var(--dim);
    opacity:0;transition:opacity .6s ease; white-space:nowrap
  }
  .hint.show{opacity:1}

  /* control bar */
  .bar{
    position:absolute;left:50%;transform:translateX(-50%);
    bottom:clamp(14px,2.6vmin,26px);z-index:4;
    display:flex;gap:3px;padding:4px;
    background:var(--panel);border:1px solid var(--line);border-radius:2px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none
  }
  .bar::-webkit-scrollbar{display:none}
  .btn{
    appearance:none;border:0;background:transparent;color:var(--dim);
    font:inherit;font-size:10.5px;letter-spacing:.1em;
    padding:8px 11px;border-radius:1px;cursor:pointer;white-space:nowrap;
    transition:color .18s ease,background .18s ease
  }
  .btn:hover{color:var(--ink);background:var(--panel-hi)}
  .btn:focus-visible{outline:1px solid var(--accent);outline-offset:1px;color:var(--ink)}
  .btn[aria-pressed="true"]{color:var(--ink);background:var(--panel-hi)}
  .btn[aria-pressed="true"]::before{
    content:"";display:inline-block;width:4px;height:4px;border-radius:50%;
    background:var(--accent);margin-right:7px;vertical-align:1px
  }
  .sep{width:1px;background:var(--line);margin:5px 3px;flex:none}

  /* loader */
  .loader{
    position:absolute;inset:0;z-index:9;display:grid;place-content:center;
    gap:14px;justify-items:center;background:var(--sky-2);
    transition:opacity .6s ease;
  }
  .loader.gone{opacity:0;pointer-events:none}
  .lbar{width:132px;height:1px;background:var(--line);position:relative;overflow:hidden}
  .lbar i{position:absolute;inset:0 100% 0 0;background:var(--accent);transition:right .35s ease}
  .lmsg{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
  .lpct{font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.1em}

  @media (max-width:640px){
    .facts{display:none}
    .btn{padding:8px 9px;font-size:10px}
  }
  @media (max-height:420px){
    .sub{display:none}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="canvas"></div>

  <div class="hud tl">
    <p class="eyebrow">Hunyuan3D · Image to 3D</p>
    <h1>3D Avatar 转台</h1>
    <p class="sub">拖拽旋转 · 滚轮缩放 · 右键平移</p>
  </div>

  <div class="hud tr">
    <div class="dial">
      <div class="az" id="az">000<span>°</span></div>
      <div class="meter"><i id="meter"></i></div>
      <div class="az-label">方位角</div>
    </div>
    <div class="facts" id="facts"></div>
  </div>

  <div class="hint" id="hint">按住左键拖动即可旋转</div>

  <div class="bar" role="toolbar" aria-label="模型控制">
    <button class="btn" id="btnRotate" aria-pressed="false">自动旋转</button>
    <button class="btn" id="btnClay" aria-pressed="false">素模</button>
    <button class="btn" id="btnTheme" aria-pressed="false">浅色台</button>
    <div class="sep" aria-hidden="true"></div>
    <button class="btn" id="btnReset">重置视角</button>
    <button class="btn" id="btnFull">全屏</button>
  </div>

  <div class="loader" id="loader">
    <div class="lpct" id="lpct">0%</div>
    <div class="lbar"><i id="lbar"></i></div>
    <div class="lmsg" id="lmsg">正在准备模型</div>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var touch=matchMedia('(pointer: coarse)').matches;
  if(touch){
    document.querySelector('.sub').textContent='拖拽旋转 · 双指缩放';
    $('hint').textContent='手指拖动即可旋转';
  }
  var MODEL_URL='avatar.glb';
  var msgs={fetch:'正在载入模型',decode:'正在解码模型',parse:'正在构建网格',done:'完成'};

  function setProgress(p,stage){
    $('lpct').textContent=Math.round(p*100)+'%';
    $('lbar').style.right=(100-p*100)+'%';
    if(msgs[stage])$('lmsg').textContent=msgs[stage];
  }

  var viewer=AV.createViewer({
    mount:$('canvas'),
    url:MODEL_URL,
    onProgress:setProgress,
    onAzimuth:function(deg){
      $('az').innerHTML=String(deg).padStart(3,'0')+'<span>°</span>';
      $('meter').style.left=(deg/360*86)+'%';
    },
    onFirstInteract:function(){ $('hint').classList.remove('show'); },
    onReady:function(s){
      var n=function(v){return v.toLocaleString('en-US')};
      $('facts').innerHTML='<b>'+n(s.tris)+'</b> 三角面<br><b>'+n(s.verts)+'</b> 顶点<br><b>'+s.meshes+'</b> 网格 · PBR 贴图';
      var ld=$('loader');
      setTimeout(function(){
        ld.classList.add('gone');
        setTimeout(function(){ ld.style.display='none'; },900);
      },180);
      setTimeout(function(){ $('hint').classList.add('show'); },1400);
      setTimeout(function(){ $('hint').classList.remove('show'); },7000);
    },
    onError:function(e){
      $('lmsg').textContent='模型加载失败，请刷新页面重试';
      $('lpct').textContent='—';
      console.error(e);
    }
  });

  function toggle(btn,fn){
    btn.addEventListener('click',function(){
      var on=btn.getAttribute('aria-pressed')!=='true';
      btn.setAttribute('aria-pressed',String(on));
      fn(on);
    });
  }
  toggle($('btnRotate'),function(on){viewer.setAutoRotate(on)});
  toggle($('btnClay'),function(on){viewer.setClay(on)});
  toggle($('btnTheme'),function(on){
    document.documentElement.setAttribute('data-theme',on?'paper':'studio');
    viewer.setTheme(on?'paper':'studio');
    $('btnTheme').textContent=on?'深色台':'浅色台';
  });
  $('btnReset').addEventListener('click',function(){viewer.reset()});
  $('btnFull').addEventListener('click',function(){
    if(document.fullscreenElement){document.exitFullscreen()}
    else{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
  });
  document.addEventListener('fullscreenchange',function(){
    $('btnFull').textContent=document.fullscreenElement?'退出全屏':'全屏';
  });
})();
</script>
</body>
</html>
